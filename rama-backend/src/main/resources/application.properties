spring.application.name=rama-backend
server.port=8080

# H2 embedded database (file mode — data persists across restarts)
spring.datasource.url=jdbc:h2:file:${user.home}/ramadb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Comma-separated list of admin emails
app.admin.emails=kalyani1aki@gmail.com

# Actuator — expose the health endpoint for ALB health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Enable H2 console for debugging (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mangoes.bern@gmail.com
# Use an App Password if 2FA is enabled on the Gmail account
#spring.mail.password=${MAIL_PASSWORD}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Disable mail health check to prevent startup failure if SMTP is unreachable or SSL fails
management.health.mail.enabled=false

# App Configuration
app.website.url=${WEBSITE_URL:http://localhost:4200}